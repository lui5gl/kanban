<section
  cdkDropList
  [id]="dropListId"
  [cdkDropListData]="cards"
  [cdkDropListConnectedTo]="connectedDropLists"
  (cdkDropListDropped)="drop($event)"
  class="flex h-full flex-col rounded-xl bg-white shadow-sm ring-1 ring-zinc-200/80 dark:bg-zinc-900 dark:ring-zinc-700/80"
>
  <!-- Column header -->
  <div
    class="flex items-center justify-between border-b border-zinc-100 px-4 py-3 dark:border-zinc-800"
  >
    <div class="flex items-center gap-2.5">
      <span
        class="h-2.5 w-2.5 rounded-full"
        [class.bg-blue-400]="column_name === 'Por hacer'"
        [class.bg-amber-400]="column_name === 'En progreso'"
        [class.bg-emerald-400]="column_name === 'Hecho'"
      ></span>
      <h2 class="text-sm font-semibold text-zinc-800 dark:text-zinc-100">
        {{ column_name }}
      </h2>
    </div>
    <span
      class="flex h-5 min-w-5 items-center justify-center rounded-full bg-zinc-100 px-1.5 text-[11px] font-semibold text-zinc-500 tabular-nums dark:bg-zinc-800 dark:text-zinc-400"
    >
      {{ cards.length }}
    </span>
  </div>

  <!-- Cards list -->
  <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-3">
    @for (card of cards; track card.id) {
      <app-card
        [id]="card.id"
        [title]="card.title"
        [column_name]="column_name"
        [description]="card.description"
        [priority]="card.priority"
        [is_archived]="card.is_archived"
        [createdAt]="card.createdAt"
        [updatedAt]="card.updatedAt"
        [dueDate]="card.dueDate"
        (save)="updateCard($event)"
        (delete)="removeCard(card.id)"
      />
    } @empty {
      <div
        class="flex flex-col items-center gap-2 rounded-xl border-2 border-dashed border-zinc-200 py-12 dark:border-zinc-700"
      >
        <i class="ti ti-inbox text-3xl text-zinc-300 dark:text-zinc-600"></i>
        <span class="text-xs font-medium text-zinc-400 dark:text-zinc-500"
          >Sin tarjetas</span
        >
      </div>
    }
  </div>

  <!-- Add card -->
  <div class="border-t border-zinc-100 p-3 dark:border-zinc-800">
    <p-button
      label="Agregar tarjeta"
      icon="ti ti-plus"
      (onClick)="addCard()"
      [text]="true"
      severity="secondary"
      size="small"
      styleClass="w-full"
    />
  </div>
</section>
