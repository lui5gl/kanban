<section
  cdkDrag
  [cdkDragDisabled]="is_archived"
  class="relative flex flex-col rounded-md bg-slate-50 text-slate-700 shadow-sm"
  [class.opacity-60]="is_archived"
  [class.cursor-not-allowed]="is_archived"
>
  <div
    class="relative flex items-center justify-center rounded-t-md bg-slate-300 px-4 py-1 text-slate-50"
  >
    <img
      cdkDragHandle
      ngSrc="/icons/grip-horizontal.svg"
      alt="Mover tarjeta"
      width="22"
      height="22"
      class="cursor-grab"
    />
    <div class="absolute top-1/2 right-2 -translate-y-1/2">
      <button
        (click)="toggleMenu($event)"
        class="flex aspect-square items-center justify-center rounded-md p-1 text-slate-50 transition-all duration-150 hover:bg-slate-200/40"
        type="button"
      >
        <img
          ngSrc="/icons/menu-2.svg"
          alt="Abrir menú de acciones"
          width="16"
          height="16"
        />
      </button>
      @if (isActionMenuOpen) {
        <div
          (click)="$event.stopPropagation()"
          class="absolute top-6 right-0 z-20 flex w-44 flex-col rounded-md border border-slate-300 bg-white text-sm text-slate-700 shadow-2xl"
        >
          <button
            type="button"
            class="flex items-center gap-2 px-4 py-2 text-left transition hover:bg-slate-100"
            (click)="toggleArchiveState($event)"
          >
            <img
              ngSrc="/icons/{{ is_archived ? 'archive-off' : 'archive' }}.svg"
              alt="{{ is_archived ? 'Desarchivar' : 'Archivar' }}"
              width="16"
              height="16"
            />
            {{ is_archived ? "Desarchivar" : "Archivar" }}
          </button>
          <button
            type="button"
            class="flex items-center gap-2 px-4 py-2 text-left transition hover:bg-slate-100"
            (click)="deleteCard($event)"
          >
            <img
              ngSrc="/icons/delete.svg"
              alt="Eliminar"
              width="16"
              height="16"
            />
            Eliminar
          </button>
        </div>
      }
    </div>
  </div>

  <div
    class="flex flex-col gap-2 rounded-b-md border border-t-0 border-slate-200 p-4"
  >
    <h3
      [attr.id]="getElementId('title')"
      (blur)="saveCard()"
      [attr.contenteditable]="is_archived ? 'false' : 'true'"
      class="cursor-text border-b-2 border-slate-200 text-xl font-semibold break-all text-neutral-800 selection:bg-sky-600 selection:text-neutral-100 focus:outline-hidden"
    >
      {{ title }}
    </h3>
    <p
      [attr.id]="getElementId('description')"
      (blur)="saveCard()"
      [attr.contenteditable]="is_archived ? 'false' : 'true'"
      class="cursor-text break-all text-neutral-800 selection:bg-sky-600 selection:text-neutral-100 focus:outline-hidden"
    >
      {{ description }}
    </p>

    <div
      class="flex flex-wrap items-center justify-between gap-4 text-sm text-slate-700"
    >
      <div class="flex flex-1 flex-col gap-1">
        <label class="font-semibold">Prioridad:</label>
        <select
          [attr.id]="getElementId('priority')"
          (change)="saveCard()"
          [value]="priority"
          [disabled]="is_archived"
          class="rounded-xs border border-slate-200 bg-white px-2 py-1"
        >
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
      </div>
      <div class="flex flex-1 flex-col gap-1">
        <label class="font-semibold">Entrega aproximada:</label>
        <input
          type="date"
          [attr.id]="getElementId('dueDate')"
          [value]="dueDate || ''"
          (change)="saveCard()"
          [disabled]="is_archived"
          class="rounded-sm border border-slate-300 bg-white px-2 py-1 text-xs text-slate-700"
        />
      </div>
    </div>
    <div
      class="flex flex-wrap justify-between gap-4 border-t border-slate-200 pt-3 text-xs text-slate-500"
    >
      <span class="text-left font-medium text-slate-600">
        {{ dueDate ? daysUntilDue : "Sin fecha de entrega" }}
      </span>
      <div class="flex flex-col gap-0.5 text-right">
        <span>Creada: {{ createdAt | date: "dd/MM/yyyy HH:mm" }}</span>
        <span>Actualizada: {{ updatedAt | date: "dd/MM/yyyy HH:mm" }}</span>
      </div>
    </div>
  </div>
</section>
