@if (visible) {
  <div
    class="border-t border-zinc-100 bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900"
  >
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-2">
      <!-- Priority pills -->
      <div class="flex items-center gap-1">
        <span
          class="mr-1 text-[11px] font-medium text-zinc-400 uppercase dark:text-zinc-500"
          >Prioridad</span
        >
        @for (p of priorityOptions; track p.value) {
          <button
            type="button"
            (click)="togglePriority(p.value)"
            class="rounded-full px-2.5 py-0.5 text-xs font-medium transition-colors"
            [class.bg-emerald-100]="
              p.value === 'low' && filterPriorities.includes(p.value)
            "
            [class.text-emerald-700]="
              p.value === 'low' && filterPriorities.includes(p.value)
            "
            [class.dark:bg-emerald-900]="
              p.value === 'low' && filterPriorities.includes(p.value)
            "
            [class.dark:text-emerald-300]="
              p.value === 'low' && filterPriorities.includes(p.value)
            "
            [class.hover:bg-emerald-50]="
              p.value === 'low' && !filterPriorities.includes(p.value)
            "
            [class.dark:hover:bg-emerald-950]="
              p.value === 'low' && !filterPriorities.includes(p.value)
            "
            [class.bg-amber-100]="
              p.value === 'medium' && filterPriorities.includes(p.value)
            "
            [class.text-amber-700]="
              p.value === 'medium' && filterPriorities.includes(p.value)
            "
            [class.dark:bg-amber-900]="
              p.value === 'medium' && filterPriorities.includes(p.value)
            "
            [class.dark:text-amber-300]="
              p.value === 'medium' && filterPriorities.includes(p.value)
            "
            [class.hover:bg-amber-50]="
              p.value === 'medium' && !filterPriorities.includes(p.value)
            "
            [class.dark:hover:bg-amber-950]="
              p.value === 'medium' && !filterPriorities.includes(p.value)
            "
            [class.bg-red-100]="
              p.value === 'high' && filterPriorities.includes(p.value)
            "
            [class.text-red-700]="
              p.value === 'high' && filterPriorities.includes(p.value)
            "
            [class.dark:bg-red-900]="
              p.value === 'high' && filterPriorities.includes(p.value)
            "
            [class.dark:text-red-300]="
              p.value === 'high' && filterPriorities.includes(p.value)
            "
            [class.hover:bg-red-50]="
              p.value === 'high' && !filterPriorities.includes(p.value)
            "
            [class.dark:hover:bg-red-950]="
              p.value === 'high' && !filterPriorities.includes(p.value)
            "
            [class.bg-zinc-100]="!filterPriorities.includes(p.value)"
            [class.text-zinc-500]="!filterPriorities.includes(p.value)"
            [class.dark:bg-zinc-800]="!filterPriorities.includes(p.value)"
            [class.dark:text-zinc-400]="!filterPriorities.includes(p.value)"
          >
            {{ p.label }}
          </button>
        }
      </div>

      <div class="h-4 w-px bg-zinc-200 dark:bg-zinc-700"></div>

      <!-- Date filter -->
      <p-select
        [options]="dueDateOptions"
        [(ngModel)]="dueDateFilter"
        optionLabel="label"
        optionValue="value"
        (ngModelChange)="onDueDateFilterChange()"
        placeholder="Fecha"
        styleClass="w-28"
      />

      <!-- Archived toggle -->
      <button
        type="button"
        (click)="toggleArchived()"
        class="rounded-full px-2.5 py-0.5 text-xs font-medium transition-colors"
        [class.bg-zinc-800]="showArchived"
        [class.text-white]="showArchived"
        [class.bg-zinc-100]="!showArchived"
        [class.text-zinc-500]="!showArchived"
        [class.hover:bg-zinc-200]="!showArchived"
        [class.dark:bg-zinc-100]="showArchived"
        [class.dark:text-zinc-900]="showArchived"
        [class.dark:bg-zinc-800]="!showArchived"
        [class.dark:text-zinc-400]="!showArchived"
        [class.dark:hover:bg-zinc-700]="!showArchived"
      >
        Archivadas
      </button>

      <!-- Clear -->
      @if (hasActiveFilters) {
        <button
          type="button"
          (click)="resetFilters()"
          class="ml-auto text-xs font-medium text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300"
        >
          Limpiar filtros
        </button>
      }
    </div>
  </div>
}
