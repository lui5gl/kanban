<p-confirmdialog />

<div class="flex h-screen flex-col bg-zinc-100 dark:bg-zinc-950">
  <!-- Main toolbar -->
  <header
    class="z-40 border-b border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900"
  >
    <app-board-header
      [showFilters]="showFilters"
      [showSortBar]="showSortBar"
      [searchTerm]="searchTerm"
      (showFiltersToggle)="showFilters = !showFilters"
      (showSortBarToggle)="showSortBar = !showSortBar"
      (searchTermChange)="onSearchChange($event)"
      (importClick)="importData()"
      (exportClick)="exportData()"
    />

    <app-filter-bar
      [searchTerm]="searchTerm"
      [visible]="showFilters"
      (filtersChange)="onFiltersChange($event)"
    />

    <!-- Sort bar (toggle) -->
    @if (showSortBar) {
      <div
        class="border-t border-zinc-100 bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900"
      >
        <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-2">
          <span
            class="text-[11px] font-medium text-zinc-400 uppercase dark:text-zinc-500"
            >Ordenar por</span
          >
          <p-select
            [options]="sortOptions"
            [(ngModel)]="sortOption"
            optionLabel="label"
            optionValue="value"
            styleClass="w-32"
          />
          <button
            type="button"
            (click)="toggleDirection()"
            class="flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-zinc-600 transition-colors hover:bg-zinc-200 dark:text-zinc-300 dark:hover:bg-zinc-700"
          >
            <i
              class="ti text-sm"
              [class.ti-arrow-up]="sortDirection === 'asc'"
              [class.ti-arrow-down]="sortDirection === 'desc'"
            ></i>
            {{ sortDirection === "asc" ? "Ascendente" : "Descendente" }}
          </button>
        </div>
      </div>
    }
  </header>

  <!-- Board -->
  <main class="flex-1 overflow-auto px-6 py-6">
    <div class="mx-auto grid max-w-7xl grid-cols-3 gap-6">
      <app-column
        column_name="Por hacer"
        [sortOption]="sortOption"
        [sortDirection]="sortDirection"
      />
      <app-column
        column_name="En progreso"
        [sortOption]="sortOption"
        [sortDirection]="sortDirection"
      />
      <app-column
        column_name="Hecho"
        [sortOption]="sortOption"
        [sortDirection]="sortDirection"
      />
    </div>
  </main>

  <!-- Footer -->
  <app-board-footer [stats]="stats" />
</div>
